<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link data-mgx-overview="icon" rel="icon" href="https://public-frontend-1300249583.cos.ap-nanjing.myqcloud.com/commonfile/DefaultAppLogo.png" />
    <title data-mgx-overview="title">Milla Salgados - Cardápio Digital</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./css/print.css" media="print">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <meta data-mgx-overview="description" name="description" content="Cardápio digital Milla Salgados - Feito em família, saboreado por todos. Faça seu pedido!" />
    <meta data-mgx-overview="og:title" property="og:title" content="Milla Salgados - Cardápio Digital" />
    <meta data-mgx-overview="og:description" property="og:description" content="Cardápio digital Milla Salgados - Feito em família, saboreado por todos. Faça seu pedido!" />
    <meta data-mgx-overview="og:image" property="og:image" content="https://public-frontend-1300249583.cos.ap-nanjing.myqcloud.com/commonfile/DefaultAppLogo.png" />
    <meta data-mgx-overview="twitter:title" name="twitter:title" content="Milla Salgados - Cardápio Digital" />
    <meta data-mgx-overview="twitter:description" name="twitter:description" content="Cardápio digital Milla Salgados - Feito em família, saboreado por todos. Faça seu pedido!" />
    <meta data-mgx-overview="twitter:image" name="twitter:image" content="https://public-frontend-1300249583.cos.ap-nanjing.myqcloud.com/commonfile/DefaultAppLogo.png" />
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <div class="header-left">
                <div class="logo">
                    <img src="https://mgx-backend-cdn.metadl.com/generate/images/1519811/2026-08-08/uczzixaaaj6a/logo-milla-salgados.png" alt="Milla Salgados" id="logo-img">
                </div>
                <div class="store-info">
                    <h1 class="store-name">Milla Salgados</h1>
                    <p class="store-slogan">Feito em família, saboreado por todos ♡</p>
                    <span class="store-status open">● Aberto agora</span>
                </div>
            </div>
            <button class="cart-btn" id="cart-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span class="cart-badge" id="cart-badge" style="display:none">0</span>
            </button>
        </div>
    </header>

    <!-- Categorias -->
    <nav class="categories-nav">
        <div class="categories-scroll" id="categories"></div>
    </nav>

    <!-- Produtos -->
    <main class="main-content">
        <div class="products-grid" id="products-grid"></div>
    </main>

    <!-- Modal do Produto -->
    <div class="modal-overlay" id="product-modal">
        <div class="modal" id="modal-content"></div>
    </div>

    <!-- Painel do Carrinho -->
    <div class="panel-overlay" id="cart-panel">
        <div class="panel">
            <div class="panel-header">
                <h2>Meu Pedido</h2>
                <button class="panel-close" id="close-cart">&times;</button>
            </div>
            <div class="panel-body">
                <div class="cart-empty" id="cart-empty">
                    <p>🛒</p>
                    <p>Seu carrinho está vazio</p>
                    <p class="cart-empty-sub">Adicione itens do cardápio</p>
                </div>
                <div class="cart-content" id="cart-content" style="display:none">
                    <div class="cart-items" id="cart-items"></div>
                    <div class="cart-footer">
                        <div class="cart-total-row">
                            <span>Total</span>
                            <span class="cart-total" id="cart-total">R$ 0,00</span>
                        </div>
                        <button class="btn-continue" id="btn-continue">Continuar comprando</button>
                        <button class="btn-checkout" id="btn-checkout">Finalizar Pedido</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Painel de Checkout -->
    <div class="panel-overlay" id="checkout-panel"></div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script type="module" src="./js/app.js"></script>
</body>

</html>
